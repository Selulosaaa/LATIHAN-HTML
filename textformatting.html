<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <!-- HTML TEXT FORMATTING TAGS -->

  <p>Ini adalah teks normal</p>
  <p>Ini adalah teks <b>bold</b></p>
  <p>Ini adalah teks <i>italic</i></p>
  <p>Ini adalah teks <big>big</big></p>
  <p>Ini adalah teks <small>small</small></p>
  <p>Ini adalah teks <sub>subscript</sub></p>
  <p>Ini adalah teks <sup>superscript</sup></p>
  <p>Ini adalah teks <ins>inserted</ins> atau teks garis bawah</p>
  <p>Ini adalah teks <del>deleted</del></p>
  <p>Ini adalah teks <mark>marked</mark></p>
  
</body>
</html>
